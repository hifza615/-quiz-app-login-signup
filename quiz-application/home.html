<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Web Development Quiz | Home</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body>
  <header class="topbar">
    <div class="brand">WEB<span>QUIZ</span></div>
   <!---<button id="logoutBtn" class="logout-btn">Logout</button>--->
  </header>

  <main class="home-page">
    <section class="quiz-home-card">
      <div class="quiz-icon">💻</div>
      <p class="eyebrow">TEST YOURSELF</p>
      <h1>Web Development Quiz</h1>
      <p class="description">Test your knowledge of HTML, CSS & JavaScript with 25 challenging questions.</p>

      <div class="info-grid">
        <div><strong>25</strong><span>Total Questions</span></div>
        <div><strong>30s</strong><span>Time / Question</span></div>
        <div><strong>3</strong><span>Topics Covered</span></div>
      </div>

      <button id="startQuizBtn" class="primary-btn large-btn">Start Quiz →</button>
    </section>
  </main>

  <script>
    if (!localStorage.getItem("currentUser")) {
      window.location.href = "index.html";
    }

    document.getElementById("startQuizBtn").addEventListener("click", () => {
      localStorage.removeItem("quizScore");
      localStorage.removeItem("quizCompleted");
      window.location.href = "quiz.html";
    });

    document.getElementById("logoutBtn").addEventListener("click", () => {
      localStorage.removeItem("currentUser");
      window.location.href = "index.html";
    });
  </script>
</body>
</html>
