<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Web Development Quiz | Result</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body>
  <main class="result-page">
    <section class="result-card">
      <div class="result-icon">🎉</div>
      <p class="eyebrow">QUIZ COMPLETED</p>
      <h1>Congratulations!</h1>
      <p>You have completed the Web Development Quiz.</p>

      <div class="score-circle">
        <span id="score">0 / 25</span>
        <small>Your Score</small>
      </div>

      <div class="percentage-box">
        <span>Percentage</span>
        <strong id="percentage">0%</strong>
      </div>

      <p id="resultMessage" class="result-message">Keep learning & keep coding! 💻</p>

      <div class="result-actions">
        <button id="retryBtn" class="primary-btn">Try Again</button>
        <button id="homeBtn" class="secondary-btn">Quiz Home</button>
      </div>
    </section>
  </main>
  <script src="js/result.js"></script>
</body>
</html>
